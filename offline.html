<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - bygdëall animes</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .offline-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
        }
        .offline-icon {
            font-size: 5rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }
        .offline-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .offline-text {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            max-width: 500px;
        }
        .offline-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <i class="fas fa-wifi-slash"></i>
        </div>
        <h1 class="offline-title">Você está offline</h1>
        <p class="offline-text">
            Parece que você perdeu a conexão com a internet. 
            Não se preocupe, alguns conteúdos podem estar disponíveis 
            para visualização offline.
        </p>
        <div class="offline-actions">
            <button class="btn btn-primary" onclick="window.location.reload()">
                <i class="fas fa-sync"></i> Tentar novamente
            </button>
            <button class="btn btn-secondary" onclick="window.location.href='/'">
                <i class="fas fa-home"></i> Página inicial
            </button>
        </div>
    </div>
</body>
</html>
